[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cs2demo-stats"
version = "0.1.0"
description = "CS2 demo statistics and an approximation of HLTV Rating 2.0"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = ["demoparser2==0.42.2"]

[project.scripts]
cs2stats = "cs2demo_parser.cli:main"
cs2tournament = "cs2demo_parser.tournament_cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cs2demo_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires a real CS2 demo, never downloads one automatically"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
